<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專案與教學知識庫 - Dashboard</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --sidebar-bg: #0f172a;
      --sidebar-text: #94a3b8;
      --sidebar-hover: #1e293b;
      --sidebar-active: #007aff;
      --card-bg: #ffffff;
      --primary: #007aff;
      --text-main: #1e293b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 手機版頂部工具列 (桌面版強制隱藏) */
    .mobile-header {
      display: none;
      height: 56px;
      background-color: var(--sidebar-bg);
      color: white;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      border-bottom: 1px solid #1e293b;
    }

    .mobile-header h2 { font-size: 16px; font-weight: 700; color: #f8fafc; }

    .menu-toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 唯一側邊欄 Sidebar (固定在左側) */
    .sidebar {
      width: 280px;
      background-color: var(--sidebar-bg);
      color: white;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 300;
      overflow-y: auto;
      border-right: 1px solid #1e293b;
      transition: transform 0.3s ease-in-out;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 { font-size: 18px; color: #f8fafc; font-weight: 800; margin: 0; }
    .sidebar-header p { font-size: 12px; color: var(--sidebar-text); margin-top: 4px; }

    .close-btn {
      display: none;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .nav-list { list-style: none; padding: 16px 12px; }
    .nav-item { margin-bottom: 6px; }

    .nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--sidebar-text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .nav-btn:hover { background-color: var(--sidebar-hover); color: #f8fafc; }
    .nav-btn.active {
      background-color: var(--sidebar-active);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .home-link-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
      text-decoration: none;
    }

    .btn-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      color: inherit;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      z-index: 250;
    }

    /* 右側主要內容容器 (iframe) */
    .main-wrapper {
      margin-left: 280px;
      flex: 1;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
    }

    iframe#content-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 768px) {
      .mobile-header { display: flex; }
      .close-btn { display: flex; align-items: center; justify-content: center; }
      
      .sidebar {
        transform: translateX(-100%);
        top: 0;
        width: 270px;
      }

      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }

      .main-wrapper {
        margin-left: 0;
        padding-top: 56px;
        height: calc(100vh - 56px);
      }
    }
  </style>
</head>
<body>

  <!-- 手機版頂部列 -->
  <header class="mobile-header">
    <h2>📂 專案與教學庫</h2>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">☰ 選單</button>
  </header>

  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- 左側唯一選單 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div>
        <h2>📂 專案與教學庫</h2>
        <p>Dashboard Hub Center</p>
      </div>
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <ul class="nav-list">
      <li class="nav-item">
        <a href="index.html" class="nav-btn home-link-btn">
          <span>🏠 返回首頁 Index</span>
          <span class="btn-badge">EXIT</span>
        </a>
      </li>
      <li class="nav-item">
        <button class="nav-btn active" onclick="loadPage('pages/ch1.html', this)">
          <span>Chapter 1: 資安指南與架構</span>
          <span class="btn-badge">現有</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-btn" onclick="loadPage('pages/ch2.html', this)">
          <span>Chapter 2: 進階 Web 攻防與資安剖析</span>
          <span class="btn-badge">更新</span>
        </button>
      </li>
      <li class="nav-item"><button class="nav-btn" onclick="loadPage('pages/ch3.html', this)"><span>Chapter 3: 預留新專案</span><span class="btn-badge">空置</span></button></li>
      <li class="nav-item"><button class="nav-btn" onclick="loadPage('pages/ch4.html', this)"><span>Chapter 4: 預留新專案</span><span class="btn-badge">空置</span></button></li>
      <li class="nav-item"><button class="nav-btn" onclick="loadPage('pages/ch5.html', this)"><span>Chapter 5: 預留新專案</span><span class="btn-badge">空置</span></button></li>
      <li class="nav-item"><button class="nav-btn" onclick="loadPage('pages/ch6.html', this)"><span>Chapter 6: 預留新專案</span><span class="btn-badge">空置</span></button></li>
      <li class="nav-item"><button class="nav-btn" onclick="loadPage('pages/ch7.html', this)"><span>Chapter 7: 預留新專案</span><span class="btn-badge">空置</span></button></li>
      <li class="nav-item"><button class="nav-btn" onclick="loadPage('pages/ch8.html', this)"><span>Chapter 8: 預留新專案</span><span class="btn-badge">空置</span></button></li>
      <li class="nav-item"><button class="nav-btn" onclick="loadPage('pages/ch9.html', this)"><span>Chapter 9: 預留新專案</span><span class="btn-badge">空置</span></button></li>
      <li class="nav-item"><button class="nav-btn" onclick="loadPage('pages/ch10.html', this)"><span>Chapter 10: 預留新專案</span><span class="btn-badge">空置</span></button></li>
    </ul>
  </aside>

  <!-- 右側內嵌獨立頁面 (預設載入 pages/ch1.html) -->
  <main class="main-wrapper">
    <iframe id="content-frame" src="pages/ch1.html"></iframe>
  </main>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function loadPage(pageUrl, btnElement) {
      const frame = document.getElementById('content-frame');
      
      // 切換右側內容頁面
      frame.src = pageUrl;

      // 切換按鈕高亮樣式
      const allBtns = document.querySelectorAll('.nav-btn');
      allBtns.forEach(btn => btn.classList.remove('active'));
      
      if (btnElement) {
        btnElement.classList.add('active');
      }

      // 手機版自動收起選單
      if (window.innerWidth <= 768) {
        toggleSidebar();
      }
    }
  </script>
</body>
</html>
