<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專案與教學知識庫 - 首頁</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --primary: #007aff;
      --primary-hover: #005bb5;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .cover-container {
      max-width: 680px;
      text-align: center;
      animation: floatEffect 5s ease-in-out infinite;
    }

    @keyframes floatEffect {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .cover-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .cover-title {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #ffffff, #38bdf8, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cover-slogan {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
      font-weight: 500;
    }

    .cover-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 26px;
      border-radius: 16px;
      font-size: 15px;
      color: #cbd5e1;
      margin-bottom: 32px;
      text-align: left;
      line-height: 1.7;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .login-placeholder-box {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px dashed var(--border-color);
      font-size: 12px;
      color: #64748b;
    }

    .start-btn {
      background: linear-gradient(90deg, #007aff, #005bb5);
      color: white;
      border: none;
      padding: 15px 42px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 122, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .start-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 122, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="cover-container">
    <span class="cover-badge">THE DIGITAL VAULT</span>
    <h1 class="cover-title">探索程式美學，<br>鍛造極致安全與除 Bug 藝廊。</h1>
    <p class="cover-slogan">「每一個精心設計的架構，都是強悍思維的具體呈現。」</p>
    
    <div class="cover-box">
      <strong>✨ 歡迎來到我的個人數位知識庫：</strong><br>
      這裡是我私房典藏的核心基地——封存著最佳化的網站架構、實戰經驗沉澱下來的突破技巧，以及滴水不漏的資安防禦邏輯。<br>
      無論是優雅的系統骨架，還是強行突破難題的極客之道，所有靈感與成果都在此一覽無遺。
      
      <div class="login-placeholder-box">
        🔒 [系統入口預留] 未來可於此處直接嵌入身分驗證與管理員權限登入。
      </div>
    </div>

    <!-- 點擊跳轉至後台 Dashboard 頁面 -->
    <a href="dashboard.html" class="start-btn">🚀 探索知識寶庫</a>
  </div>

</body>
</html>
