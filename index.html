<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專案與教學知識庫 - 首頁</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --primary: #007aff;
      --primary-hover: #005bb5;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .cover-container {
      max-width: 680px;
      text-align: center;
      animation: floatEffect 5s ease-in-out infinite;
    }

    @keyframes floatEffect {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .cover-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .cover-title {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #ffffff, #38bdf8, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cover-slogan {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .cover-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 14px;
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 32px;
      text-align: left;
      line-height: 1.6;
    }

    /* 預留未來登入表單的區塊 */
    .login-placeholder-box {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-color);
      font-size: 12px;
      color: #64748b;
    }

    .start-btn {
      background: linear-gradient(90deg, #007aff, #005bb5);
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 122, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .start-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 122, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="cover-container">
    <span class="cover-badge">KNOWLEDGE HUB CENTER</span>
    <h1 class="cover-title">以極致安全與簡約架構，<br>打造個人化專案知識庫。</h1>
    <p class="cover-slogan">「零干擾、高安全性、無限擴充的數位系統展示平台」</p>
    
    <div class="cover-box">
      <strong>💡 系統入口與架構邏輯：</strong><br>
      • 本頁（index.html）為前台入口門面，預留未來的身分驗證與登入機制。<br>
      • 後台（dashboard.html）採用模組化導覽，動態讀取 <code>pages/</code> 資料夾下的獨立章節網頁。
      
      <div class="login-placeholder-box">
        🔒 [預留位置] 未來可於此處直接嵌入 Firebase Auth 登入 / 密碼驗證表單。
      </div>
    </div>

    <!-- 點擊跳轉至獨立的後台 Dashboard 頁面 -->
    <a href="dashboard.html" class="start-btn">🚀 進入系統 Dashboard</a>
  </div>

</body>
</html>
